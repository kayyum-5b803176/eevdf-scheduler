# JVM heap. 2 GB was tight for KSP + Hilt + Room codegen across five modules on
# a 20k-line codebase; 4 GB removes the intermittent OOM during annotation
# processing. Lower it if your machine is memory constrained.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.code.style=official

# Build speed. Configuration cache is the big one for incremental builds; if a
# plugin turns out to be incompatible, set it to false rather than reverting
# everything else here.
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache is left OFF: AGP 8.5 + KSP + Hilt is not reliably
# CC-clean, and this project has bigger problems than build speed right now.
# Try flipping it to true once the build is green and stable.
org.gradle.configuration-cache=false
org.gradle.configureondemand=true

# Only generate the R class fields each module actually uses.
android.nonTransitiveRClass=true

kotlin.incremental=true
ksp.incremental=true
