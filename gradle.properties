# JVM heap. 2 GB was tight for KSP + Hilt + Room codegen across five modules on
# a 20k-line codebase; 4 GB removes the intermittent OOM during annotation
# processing. Lower it if your machine is memory constrained.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.code.style=official

# Build speed. Configuration cache is the big one for incremental builds; if a
# plugin turns out to be incompatible, set it to false rather than reverting
# everything else here.
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache is left OFF: AGP 8.5 + KSP + Hilt is not reliably
# CC-clean, and this project has bigger problems than build speed right now.
# Try flipping it to true once the build is green and stable.
org.gradle.configuration-cache=false
org.gradle.configureondemand=true

# Only generate the R class fields each module actually uses.
# v6.10.2: set to false.
#
# With nonTransitiveRClass=true, each module R class contains ONLY that
# module own resources. That was harmless while every screen lived in the
# single :feature module and shared one R. Now that each capability is its
# own module, settings-screens R.color/R.dimen/R.style no longer resolve
# design-system entries, and the same would hit every other capability that
# themes itself from the design system.
#
# The alternative — rewriting several hundred R.* references to point at
# com.eevdf.capabilities.designsystem.R explicitly — is churn with no
# architectural benefit: design-system is a declared dependency either way,
# so transitive R access does not weaken any capability boundary. Set false
# so a capability sees the resources of the capabilities it depends on.
android.nonTransitiveRClass=false

kotlin.incremental=true
ksp.incremental=true
